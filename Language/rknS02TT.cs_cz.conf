 Texts {
  "1) Move through the canyon to the tunnel entrance. Engage targets along the way."\
  ""\
  "2) Clear out the tunnel."\
  ""\
  "3) Take the tunnel exit to left at the fork."\
  ""\
  "4) Ascend the hill. Engage targets to the front. Then turn right into the ruins."\
  ""\
  "5) Move through the ruins and engage far targets at the shooting position."
  "Tunnel Rat"
  "1) Engage the targets in front, down the path."\
  ""\
  "2) Take a left and enter the dry channel. Move along it while engaging targets."\
  ""\
  "3) At the end, take a left up between the rocks and then down to the water front street. Engage the targets on the beach and in the water."\
  ""\
  "4) Move through the backalley while engagin targets to the right."\
  ""\
  "5) At the road, take a left to the sanbag positions. Engage targets at the refueling station. Turn around and engage targets at the next sandbags."\
  ""\
  "6) Move into the church and engage targets from the lower level."\
  ""\
  "7) Move up the stairs to the belltower. Engage targets out the doors to your right after ascending the ladder. Then turn 180 and do the same on the other side."\
  ""\
  "8) Turn left out the last tower doors onto the roof. Sprint to the finish line on the other end of the roof."
  "Naval Nuisance"
  "Oh god they're multiplying!"
  "Clownhouse"
  "1) Engage targets while leaning from sandbag cover with pistol."\
  ""\
  "2) Shoot the targets in prone position under the tin wall."\
  ""\
  "3) Move to the left, and engage targets again on the first range with pistol while standing."\
  ""\
  "4) Move to next position down the street along the sidewalk. Engage targets in the windows of the opposite building from crouch position. You may need to use the full range of the variable stance system to hit all targets while crouched."\
  ""\
  "5) Move further down the street to next position and repeat previous step, from standing position this time."\
  ""\
  "6) Move across the street and shoot the targets within the courtyard."\
  ""\
  "7) Move back out of the courtyard, take a right towards the sandbag shooting position, and engage targets at long range with precision rifle."\
  ""\
  "8) Take a left and shoot targets through the first and then second hole in the sandbag wall."\
  ""\
  "9) Sprint to the finish to your left."
  "Phillip's Street"
  "A course is split into sections. Completing sections usually means shooting all targets from a specific position, before moving on to the next section at a new position. These positions can sometimes have requirements, such as stance and weapon type. Leaving the shooting position before completing the section may result in failure of the course."\
  ""\
  "At each section you will notice a number in your upper left corner, which will count down each time you hit a target. This is the counter for remaining required objectives of the current section."\
  ""\
  "For this course you must shoot the targets at each of the three positions. They each have stance and weapon requirements, which must be met before the targets are activated."
  "Range Sequence"
  "Train your accuracy while moving and inhibited by obstacles."
  "Killhouse"
  "1) Clear all obstacles to the left. "\
  ""\
  "2) Turn 180 right and complete the center obstacles."\
  ""\
  "3) Sprint to the finish line near the flagpole."
  "Obstacle Course"
  "For each section, find the window with the active target. After hitting it a sequence of timed targets will appear."
  "Whack-an-Invader"
  "1) Engage the targets to your left."\
  ""\
  "2) Exit the road and follow the path marked by painted poles."\
  ""\
  "3) Move to the first shooting position and engage targets at long range."\
  ""\
  "4) Stand and follow the path."\
  ""\
  "5) Move to the second shooting position and engage targets at long range."
  "Extended Range"
  "There are three different targets. Standard, popper, and clay disc."\
  ""\
  "Popper targets are the small white metal ones. Standard targets are the large wooden ones with image of a man on the front. Shooting these two types are usually a requirement to proceed."\
  ""\
  "Clay targets are the red discs on wooden poles. They are optional targets that give bonus time."\
  ""\
  "Popper and standard targets can also give bonus if you hit the center of each."\
  ""\
  "Civilian targets are the purple static ones. If hit you will be given a penalty."\
  ""\
  "Targets can only be shot while activated. Popper and standard targets can fold, and are activated once they are upright."\
  ""\
  "Targets will generally activate once their assigned course section is activated. But their activation can also be configured to be delayed by some time. Additionally, they may have some prerequiside objective. Usually a shooting position, but can also be another target."\
  ""\
  "Targets can sometimes be placed on rails, which allow them to move."
  "Introduction Course"
  "1) Shoot all targets on or at the base of the walls."\
  ""\
  "2) Enter through the opened gate and engage those targets at the entrance."\
  ""\
  "3) Turn left and engage targets near the camping area."\
  ""\
  "4) Turn right and up the center ruins, and clear it."\
  ""\
  "5) Cross the bridge, clear the area, and open the cage."
  "Rescue The Princess"
  "1) Engage the targets to the left. Then proceed through the forest to the pond, by follwing the red barriers."\
  ""\
  "2) Move to the edge of the pond and engage the targets."\
  ""\
  "3) Move clockwise around the pond and engage targets from the first sandbags."\
  ""\
  "4) Continue to the second set of sandbags and engage the targets by the bee hives."\
  ""\
  "5) Jump over the fence and drive the vehicle along the designated path to the beach."\
  ""\
  "6) Enter the bunker and engage the targets on the other side of the bay."
  "Fisherman"
  "1) Enter the yard and engage targets."\
  ""\
  "2) Enter through the backdoor of the building and clear it of targets."\
  ""\
  "3) Exit through the front door to the finish line."
  "Home Invasion"
  "1) Enter the building and move through the corridor to the far-end exit. Engage targets to your left and right along the way."\
  ""\
  "2) Clear targets in the backyard and exit through the fence in the back."\
  ""\
  "3) Turn left and engage targets at the first range."\
  ""\
  "4) Turn right and head into the field where there towards the second range."\
  ""\
  "5) Engage the targets at the second range from a crouched position."\
  ""\
  "6) Turn right and clear the yard of the next building complex."\
  ""\
  "7) Move to the far left side of the yard, climb the stairs, and engage the targets at the third range with your rifle."
  "Crop Harvesting"
  "1) Move to the vehicle while engaging the targets to your right."\
  ""\
  "2) Enter the vehicle and follow the route to the military base. Navigate through the base until you get to the target range, at which point to exit the vehicle."\
  ""\
  "3) Engage target at the range."\
  ""\
  "4) Enter the multi-story building and make your way to the roof."\
  ""\
  "5) Engage targets along the mountain at long range."\
  ""\
  "6) Descend the ladder to the finish line."
  "Drive-in"
  "1) Clear the building."\
  ""\
  "2) Exit to the courtyard through the backdoor, enter the marked position and engage the targets as they activate."\
  ""\
  "3) Enter and move through the garage and exit thorugh the south-east door."\
  ""\
  "4) Move along the wall, cross the road, and engage the targets in the area."\
  ""\
  "5) Move to the finish line down the dirt path."
  "Funhouse"
  "<h2>RKN Time Trials</h2>"\
  "Complete shooting and driving courses, and compete for the best scores."\
  ""\
  "Spawn at \"Training Camp\" and play the intro course if this is your first time playing RKN Time Trials."\
  ""\
  "Look at your map to find courses. Walk up to the course control panel and use the actions to get course description or start the course."\
  ""\
  "Open your map and click the spawn icons to fast travel there. If you throw away your map, you can respawn with a new one."
